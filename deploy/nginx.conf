# Place at /etc/nginx/sites-available/isbn-cataloger, then:
#   sudo ln -s /etc/nginx/sites-available/isbn-cataloger /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your domain once DNS is pointed here; until then
# the public IP address works fine for server_name too.

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
